name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        f_cpu: [16000000L, 8000000L, 1000000L]
        spi_pins:
          - SPI_PINS_CE9_CSN10
          - SPI_PINS_CSN7_CE8
          - SPI_PINS_CE7_CSN8
          - SPI_PINS_CE7_CSN10
          - SPI_PINS_CE4_CSN10
          - SPI_PINS_CE10_CSN9
          - SPI_PINS_CE4_CSN5
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr cmake
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc.cmake
          -DF_CPU=${{ matrix.f_cpu }} -DSPI_PINS=${{ matrix.spi_pins }}
      - name: Build (fails if the image exceeds 2048 bytes)
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: MYSBootloader-${{ matrix.f_cpu }}-${{ matrix.spi_pins }}
          path: build/*.hex

  options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr cmake
      - name: Feature combinations still fit
        run: |
          for opts in "-DBOOTLOADER_COMMANDS=OFF" "-DWATCHDOG_ON_SKETCH_START=OFF" "-DBOOTLOADER_DEBUG=ON" \
                      "-DDATARATE=RF24_2MBPS -DPA_LEVEL=RF24_PA_MIN -DCHANNEL=1"; do
            rm -rf build
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc.cmake -DF_CPU=16000000L $opts
            cmake --build build
          done

  simulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        f_cpu: [16000000, 8000000, 1000000]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and simulator
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr cmake libsimavr-dev libelf-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc.cmake -DF_CPU=${{ matrix.f_cpu }}L
          cmake --build build
      - name: Run bootloader in simavr
        run: tests/sim/run.sh build/MYSBootloader.*.elf ${{ matrix.f_cpu }}

  # Not a gate: measures the newest avr-gcc (Debian trixie ships 14) against the sizes of the tuned avr-gcc 7.3 images
  # and runs the simulator on them, so a toolchain migration can be decided on data. avr-gcc 14 cannot link the register
  # variable with LTO, hence -DLTO=OFF.
  newer-toolchain:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - {f_cpu: 16000000, reference: 1728}
          - {f_cpu: 8000000, reference: 1732}
          - {f_cpu: 1000000, reference: 1716}
    steps:
      - name: Install toolchain and simulator
        run: apt-get update && apt-get install -y git gcc gcc-avr avr-libc binutils-avr cmake make libsimavr-dev libelf-dev
      - uses: actions/checkout@v4
      - name: Build without LTO
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc.cmake -DF_CPU=${{ matrix.f_cpu }}L -DLTO=OFF -DSIZE_CHECK=OFF
          cmake --build build | tee build.log
          size=$(sed -n 's/.*flash use: \([0-9]*\) of.*/\1/p' build.log)
          {
            echo "### $(avr-gcc --version | head -1), F_CPU=${{ matrix.f_cpu }}"
            echo "| avr-gcc 7.3 reference | this compiler | delta |"
            echo "|-----------------------|---------------|-------|"
            echo "| ${{ matrix.reference }} B | ${size} B | $((size - ${{ matrix.reference }})) B |"
            [ "$size" -le 2048 ] && echo "Fits in the boot section." || echo "**Does not fit in 2048 bytes.**"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run bootloader in simavr
        run: tests/sim/run.sh build/MYSBootloader.*.elf ${{ matrix.f_cpu }}
